[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./out" }]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
xlayer_testnet = "${X_LAYER_TESTNET_RPC_URL}"
xlayer_mainnet = "${X_LAYER_MAINNET_RPC_URL}"

[etherscan]
xlayer_testnet = { key = "${OKLINK_API_KEY}", url = "https://www.oklink.com/api/explorer/v1/contract/verify/async/api/xlayer-test" }
xlayer_mainnet = { key = "${OKLINK_API_KEY}", url = "https://www.oklink.com/api/explorer/v1/contract/verify/async/api/xlayer" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
